spring.application.name=oas

management.endpoint.health.probes.enabled=true


management.health.cassandra.enabled=false

# Postgres Settings
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5433/oas_db}
spring.jpa.properties.hibernate.jdbc.time_zone=Asia/Kolkata
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:oas_user}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:oas_password}
spring.datasource.driver-class-name=org.postgresql.Driver

# Hibernate Settings
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
# Quote all SQL identifiers so reserved words (e.g. the `user` table) are valid; safe for existing lowercase names.
spring.jpa.properties.hibernate.globally_quoted_identifiers=true

# Redis Settings
spring.redis.host=${SPRING_REDIS_HOST:localhost}
spring.redis.port=${SPRING_REDIS_PORT:6379}
spring.redis.cacheTtl=3600
search.result.redis.ttl = 36000


# Elastic Search Settings
elasticsearch.host=${ELASTICSEARCH_HOST:localhost}
elasticsearch.port=${ELASTICSEARCH_PORT:9200}
elasticsearch.username=${ELASTICSEARCH_USERNAME:elastic}
elasticsearch.password=${ELASTICSEARCH_PASSWORD:changeme}

# File Upload Settings (ImportService enforces its own 5MB cap; servlet limit must not be lower)
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=5MB


# Lifecycle (draft -> add -> approve -> review) switches
# Service-wide master switch. false => NO catalogue follows the lifecycle: its lifecycle
# endpoints 404 and create persists ACTIVE instead of PENDING. CRUD, search, read, import
# and loadFromPrimary are unaffected.
catalogue.lifecycle.enabled=${CATALOGUE_LIFECYCLE_ENABLED:true}



# Per-catalogue override, keyed by the catalogue's URL segment (lowercase, no separators).
# Effective policy = catalogue.lifecycle.enabled AND catalogue.lifecycle.entities.<name>
# change is folded into registry_template/ and regenerated.

catalogue.lifecycle.entities.user=false
catalogue.lifecycle.entities.org=false
catalogue.lifecycle.entities.catalogue=false



# auth_service (AuthUserService posts onboarded identities to /auth/v1/auth_user_create)
auth.service.url=${AUTH_SERVICE_URL:http://18.183.107.166}
# Api key value only; the header name it is sent on lives in AuthUserService.API_KEY_HEADER.
# Supply via the env var - do not commit a real key here.
auth.service.api.key=${AUTH_SERVICE_API_KEY:}

#Application Specific
search.string.max.regex.length=50
elastic.required.field.org.json.path=/EsFieldsmapping/esOrgRequiredFields.json
elastic.required.field.user.json.path=/EsFieldsmapping/esUserRequiredFields.json
elastic.required.field.catalogue.json.path=/EsFieldsmapping/esCatalogueRequiredFields.json
elastic.required.field.catalogueassignment.json.path=/EsFieldsmapping/esCatalogueassignmentRequiredFields.json
elastic.required.field.departmenttype.json.path=/EsFieldsmapping/esDepartmenttypeRequiredFields.json
